<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eLibrary - Register</title>
    <link rel="stylesheet" href="forms.css">
    <style>
        #guud p {
            float: right;
            margin-right: 20px;

        }

        #guud a {
            color: #007BFF;
            font-family: sans-serif;
            text-align: right;
            text-decoration: none;
            text-align: end;
        }

        #guud a:hover {
            color: blue;
            text-decoration: underline;
            text-shadow: 1px 1px 2px blue;
        }
    </style>
</head>

<body>
    <header>
        <h1>eLibrary</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="books.html">Books</a></li>
                <li><a href="contact-us.html">Contact Us</a></li>
                <li><a href="about-us.html">About Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <div class="hero">
                <h2>
                    Ready to start your journey with eLibrary? Register for a free account today and begin exploring our
                    vast collection of books.
                </h2>
                <p> It's easy, secure, and completely free!</p>
            </div>
            <form id="registration-form">
                <h2 style="text-align: center;">Register your Account:</h2>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Password:</label>
                <div>
                    <input type="password" id="password" name="password" required>
                </div>

                <label for="confirm-password">Confirm Password:</label>
                <div>
                    <input type="password" id="confirm-password" name="confirm-password" required>
                </div>
                <div id="guud">
                    <p>
                        <a href="login.html">Login</a>
                    </p>
                    <p>
                        Already have an account!! </p>

                </div>
                <button type="submit">Next Step</button>
            </form>
        </section>
    </main>
    <script src="regvalidation.js"></script>
</body>

</html>
