<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

</head>

<body>
    <header>
        <div class="logo">
            <h1>eLibrary</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>

    <main>
        <section>
            <form id="registration-step2-form">
                <p
                    style="float: left;text-decoration: none;font-family: sans-serif;font-size: large; font-weight: 600;">
                    <a href="registration.html" style="float: left; margin-left: 20px;">👈Go
                        Back</a>
                </p><br><br>
                <h2 style="float: left; font-size: 22px;">Select an username for your account:</h2>
                <input type="text" id="username" name="username" placeholder="Username" required>

            </form>

    <script>
        // This JavaScript file will handle the second step of registration (username)
        document.getElementById('registration-step2-form').addEventListener('submit', function (e) {
            e.preventDefault();
            // Redirect to the login page after successful registration
            window.location.href = 'login.html';
        });
    </script>
